runtime: python311
instance_class: F1

handlers:
- url: /
  static_files: index.html
  upload: index.html

- url: /(.*)\.(js|css|json|geojson|csv|png|jpg|svg|ico|txt|html)$
  static_files: \1.\2
  upload: (.*)\.(js|css|json|geojson|csv|png|jpg|svg|ico|txt|html)$

- url: /.*
  static_files: index.html
  upload: index.html
